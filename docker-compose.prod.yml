# =============================================================
# Oficina Fusion — docker-compose PRODUCCIÓN
#
# Servicios:
#   db        postgres 16, solo red interna (sin puertos publicados)
#   backend   NestJS API, healthcheck TCP, depende de db sana
#   frontend  Next.js, healthcheck HTTP, depende de backend sano
#   nginx     reverse proxy 80/443 -> frontend (/) + backend (/api/)
#
# Uso:
#   cp .env.production.example .env.production
#   # completar secretos reales en .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# =============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: of-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_fusion}
    # Sin `ports:` a propósito: la DB solo es alcanzable dentro de la red
    # docker interna (`internal`), nunca expuesta al host/Internet.
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oficina_fusion}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: of-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oficina_fusion}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: ${BACKEND_PORT:-3001}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3001/auth/me',res=>process.exit(res.statusCode?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy --schema=prisma/schema.prisma && node dist/main"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: of-prod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: of-prod-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata_prod:
    driver: local

networks:
  internal:
    driver: bridge
