# fly.toml — Oficina Fusion Backend (NestJS)
app = "oficina-fusion-backend"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile.fly"

# Aplica las migraciones pendientes antes de liberar cada versión; si fallan,
# el deploy se aborta y queda la versión anterior.
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
